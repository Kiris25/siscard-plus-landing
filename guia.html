<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guía interactiva del Landing Siscard+">
    <title>Guía interactiva | Landing Siscard+</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        :root {
            --guide-orange: #ff6c0c;
            --guide-gray: #58595b;
            --guide-light: #f2f2f2;
            --guide-line: #dddddd;
        }
        .guide-shell {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 16px;
            min-height: calc(100vh - 150px);
        }
        .guide-panel,
        .guide-preview {
            border: 1px solid var(--line, var(--guide-line));
            border-radius: var(--radius-large, 12px);
            background: #ffffff;
            box-shadow: var(--shadow-small, 0 4px 16px rgba(0, 0, 0, 0.08));
        }
        .guide-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .guide-panel-header {
            padding: 20px;
            border-top: 5px solid var(--guide-orange);
            background: var(--guide-gray);
            color: #ffffff;
        }
        .guide-panel-header span {
            display: block;
            margin-bottom: 7px;
            color: #ffd1ad;
            font-size: 11px;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .guide-panel-header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 28px;
            font-weight: 350;
        }
        .guide-progress {
            height: 7px;
            background: #dedede;
        }
        .guide-progress span {
            display: block;
            width: 0;
            height: 100%;
            background: var(--guide-orange);
            transition: width 0.3s ease;
        }
        .guide-step {
            flex: 1;
            padding: 22px;
        }
        .guide-step-number {
            color: var(--guide-orange);
            font-size: 11px;
            font-weight: 850;
            text-transform: uppercase;
        }
        .guide-step h2 {
            margin: 7px 0 10px;
            color: var(--sidebar, var(--guide-gray));
            font-size: 27px;
            font-weight: 400;
        }
        .guide-step p {
            margin: 0;
            color: var(--muted, #666666);
            line-height: 1.65;
        }
        .guide-functions {
            display: grid;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }
        .guide-functions li {
            position: relative;
            padding: 10px 11px 10px 36px;
            border: 1px solid var(--line, var(--guide-line));
            background: var(--surface-soft, var(--guide-light));
            color: var(--ink, #333333);
            line-height: 1.4;
        }
        .guide-functions li::before {
            content: "✓";
            position: absolute;
            left: 12px;
            color: var(--guide-orange);
            font-weight: 900;
        }
        .guide-note {
            margin-top: 16px;
            padding: 12px;
            border-left: 4px solid var(--guide-orange);
            background: #fff4ec;
            color: #555555;
            font-size: 13px;
            line-height: 1.5;
        }
        .guide-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 16px 20px;
            border-top: 1px solid var(--line, var(--guide-line));
            background: #fafafa;
        }
        .guide-action-group {
            display: flex;
            gap: 8px;
        }
        .guide-button {
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid #b8b8b8;
            border-radius: var(--radius-small, 6px);
            background: #ffffff;
            color: #444444;
            font-weight: 750;
            cursor: pointer;
        }
        .guide-button.primary {
            border-color: #e55d00;
            background: var(--guide-orange);
            color: #ffffff;
        }
        .guide-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .guide-preview {
            position: relative;
            min-height: 720px;
            overflow: hidden;
        }
        .preview-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
            min-height: 48px;
            padding: 0 14px;
            border-bottom: 1px solid var(--line, var(--guide-line));
            background: var(--guide-light);
        }
        .preview-dots {
            display: flex;
            gap: 5px;
        }
        .preview-dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #b8b8b8;
        }
        .preview-dots span:first-child {
            background: var(--guide-orange);
        }
        .preview-title {
            overflow: hidden;
            color: #555555;
            font-size: 12px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .open-module-link {
            color: var(--guide-orange);
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
        }
        .guide-frame {
            width: 100%;
            height: 670px;
            border: 0;
            background: #ffffff;
        }
        .guide-welcome {
            display: grid;
            place-items: center;
            height: 670px;
            padding: 30px;
            background: linear-gradient(135deg, #f7f7f7, #fff4ec);
            text-align: center;
        }
        .guide-welcome-inner {
            max-width: 650px;
        }
        .guide-welcome-icon {
            display: grid;
            place-items: center;
            width: 100px;
            height: 100px;
            margin: 0 auto 22px;
            border: 1px solid #ffd1ad;
            border-radius: 50%;
            background: #ffffff;
            color: var(--guide-orange);
            font-size: 44px;
        }
        .guide-welcome h2 {
            margin: 0;
            color: var(--guide-gray);
            font-size: clamp(34px, 5vw, 52px);
            font-weight: 300;
        }
        .guide-welcome p {
            margin: 15px 0 0;
            color: #666666;
            line-height: 1.7;
        }
        .guide-finish-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 22px;
        }
        @media (max-width: 1020px) {
            .guide-shell {
                grid-template-columns: 1fr;
            }
            .guide-preview {
                min-height: 620px;
            }
            .guide-frame,
            .guide-welcome {
                height: 570px;
            }
        }
        @media (max-width: 650px) {
            .guide-actions {
                align-items: stretch;
                flex-direction: column;
            }
            .guide-action-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            .guide-button {
                width: 100%;
            }
            .preview-bar {
                grid-template-columns: 1fr auto;
            }
            .preview-dots {
                display: none;
            }
            .preview-title {
                text-align: left;
            }
        }
    </style>
</head>
<body data-page-title="Guía interactiva Siscard+" data-page-subtitle="Recorrido de demostración">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="main-area">
            <div id="topbar-container"></div>
            <main class="content">
                <section class="guide-shell" aria-label="Guía interactiva del portal">
                    <aside class="guide-panel">
                        <header class="guide-panel-header">
                            <span>Demostración guiada</span>
                            <h1>Conozca el Landing Siscard+</h1>
                        </header>
                        <div class="guide-progress" aria-hidden="true">
                            <span id="guideProgress"></span>
                        </div>
                        <div class="guide-step">
                            <span class="guide-step-number" id="guideStepNumber"></span>
                            <h2 id="guideTitle"></h2>
                            <p id="guideText"></p>
                            <ul class="guide-functions" id="guideFunctions"></ul>
                            <div class="guide-note" id="guideNote" hidden></div>
                        </div>
                        <footer class="guide-actions">
                            <button class="guide-button" id="exitGuideButton" type="button">Salir</button>
                            <div class="guide-action-group">
                                <button class="guide-button" id="previousGuideButton" type="button">Anterior</button>
                                <button class="guide-button primary" id="nextGuideButton" type="button">Iniciar</button>
                            </div>
                        </footer>
                    </aside>
                    <section class="guide-preview" aria-label="Vista del módulo">
                        <div class="preview-bar">
                            <div class="preview-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                            <span class="preview-title" id="previewTitle">Landing Siscard+</span>
                            <a class="open-module-link" id="openModuleLink" href="index.html" target="_blank" rel="noopener">Abrir módulo</a>
                        </div>
                        <div class="guide-welcome" id="guideWelcome">
                            <div class="guide-welcome-inner">
                                <div class="guide-welcome-icon" aria-hidden="true">▶</div>
                                <h2>Recorrido interactivo</h2>
                                <p>La demostración abrirá cada módulo dentro de esta página y explicará las funciones disponibles. No se enviarán solicitudes ni se modificarán datos durante el recorrido.</p>
                            </div>
                        </div>
                        <iframe class="guide-frame" id="guideFrame" title="Vista previa del módulo" hidden></iframe>
                    </section>
                </section>
            </main>
            <div id="footer-container"></div>
        </div>
    </div>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script>
        "use strict";

        const guideSteps = [
            {
                title: "Bienvenida",
                page: "",
                text: "Esta guía presenta los módulos disponibles y abre cada sección para mostrar, de forma guiada, qué puede hacerse en el portal.",
                functions: [
                    "Avanzar o retroceder entre los módulos.",
                    "Abrir el módulo mostrado en una pestaña independiente.",
                    "Salir del recorrido y regresar al Inicio en cualquier momento."
                ],
                note: "Seleccione Iniciar para comenzar la primera demostración."
            },
            {
                title: "Inicio",
                page: "index.html",
                text: "El Inicio funciona como punto central para acceder a los servicios del Landing Siscard+.",
                functions: [
                    "Explorar las tarjetas de los módulos disponibles.",
                    "Buscar un servicio desde el buscador principal.",
                    "Consultar accesos rápidos y novedades del portal.",
                    "Volver a iniciar esta guía rápida."
                ]
            },
            {
                title: "Manuales",
                page: "manuales.html",
                text: "El Centro de Conocimiento reúne la documentación disponible para consulta.",
                functions: [
                    "Buscar documentos por nombre o palabra clave.",
                    "Filtrar el contenido por categoría.",
                    "Abrir manuales y guías disponibles.",
                    "Acceder al visor de Parámetros del Emisor TRT08SN0."
                ]
            },
            {
                title: "Parámetros del Emisor TRT08SN0",
                page: "manuales.html#parametros-emisor",
                text: "Desde Manuales se accede al repositorio dinámico de parámetros del emisor.",
                functions: [
                    "Abrir el visor publicado de parámetros.",
                    "Localizar opciones y configuraciones documentadas.",
                    "Consultar la información funcional disponible para cada parámetro."
                ],
                note: "El acceso se encuentra integrado dentro del Centro de Conocimiento."
            },
            {
                title: "Formularios",
                page: "formularios.html",
                text: "Este módulo permite seleccionar y completar los formularios habilitados para los distintos procesos.",
                functions: [
                    "Seleccionar el formulario requerido.",
                    "Completar la información solicitada en cada sección.",
                    "Conservar la información registrada durante la preparación.",
                    "Enviar la solicitud para su revisión."
                ],
                note: "Durante esta guía no se enviará ningún formulario."
            },
            {
                title: "Aprobaciones",
                page: "aprobaciones.html",
                text: "Aprobaciones centraliza la revisión de formularios y solicitudes pendientes.",
                functions: [
                    "Consultar solicitudes pendientes de revisión.",
                    "Abrir el detalle y revisar las respuestas enviadas.",
                    "Aprobar o rechazar una solicitud.",
                    "Registrar observaciones y consultar la bitácora disponible."
                ],
                note: "Los botones de decisión se muestran únicamente para explicar el flujo."
            },
            {
                title: "Mis solicitudes",
                page: "mis-solicitudes.html",
                text: "Este espacio permite dar seguimiento a las gestiones registradas desde el portal.",
                functions: [
                    "Consultar las solicitudes enviadas.",
                    "Identificar el estado actual de cada gestión.",
                    "Abrir el detalle de una solicitud.",
                    "Revisar respuestas y observaciones asociadas."
                ]
            },
            {
                title: "Seguridad",
                page: "seguridad.html",
                text: "El módulo de Seguridad se implementará en una etapa posterior.",
                functions: [
                    "Construcción y mantenimiento de usuarios.",
                    "Administración de grupos de seguridad.",
                    "Asignación de accesos según el grupo del usuario.",
                    "Configuración futura de menús, opciones, subopciones, funciones y programas."
                ],
                note: "Actualmente se muestra un mensaje informativo de próxima implementación."
            },
            {
                title: "Landing IA",
                page: "landing-ia.html",
                text: "Landing IA funciona como asistente para orientar consultas dentro del portal.",
                functions: [
                    "Escribir una consulta sobre los servicios disponibles.",
                    "Utilizar las sugerencias de consulta.",
                    "Localizar el módulo relacionado con una necesidad.",
                    "Iniciar una nueva conversación de orientación."
                ]
            },
            {
                title: "Comunicados",
                page: "comunicados.html",
                text: "Comunicados concentra los avisos, novedades y actualizaciones publicados.",
                functions: [
                    "Consultar las publicaciones disponibles.",
                    "Buscar comunicados.",
                    "Aplicar los filtros disponibles.",
                    "Abrir el detalle de un aviso o actualización."
                ]
            },
            {
                title: "Recorrido completado",
                page: "",
                text: "La primera demostración ha finalizado. El Landing Siscard+ está listo para explorarse desde el Inicio o desde el menú lateral.",
                functions: [
                    "Repetir la guía cuando sea necesario.",
                    "Regresar al Inicio.",
                    "Abrir directamente cualquiera de los módulos presentados."
                ],
                note: "La guía permanecerá disponible para futuras demostraciones."
            }
        ];

        const guideProgress = document.getElementById("guideProgress");
        const guideStepNumber = document.getElementById("guideStepNumber");
        const guideTitle = document.getElementById("guideTitle");
        const guideText = document.getElementById("guideText");
        const guideFunctions = document.getElementById("guideFunctions");
        const guideNote = document.getElementById("guideNote");
        const previousGuideButton = document.getElementById("previousGuideButton");
        const nextGuideButton = document.getElementById("nextGuideButton");
        const guideFrame = document.getElementById("guideFrame");
        const guideWelcome = document.getElementById("guideWelcome");
        const previewTitle = document.getElementById("previewTitle");
        const openModuleLink = document.getElementById("openModuleLink");
        let currentGuideStep = 0;

        function renderGuideStep() {
            const step = guideSteps[currentGuideStep];
            guideStepNumber.textContent = `Paso ${currentGuideStep + 1} de ${guideSteps.length}`;
            guideTitle.textContent = step.title;
            guideText.textContent = step.text;
            guideFunctions.innerHTML = "";
            step.functions.forEach(function (item) {
                const listItem = document.createElement("li");
                listItem.textContent = item;
                guideFunctions.appendChild(listItem);
            });
            guideNote.hidden = !step.note;
            guideNote.textContent = step.note || "";
            guideProgress.style.width = `${((currentGuideStep + 1) / guideSteps.length) * 100}%`;
            previousGuideButton.disabled = currentGuideStep === 0;
            nextGuideButton.textContent = currentGuideStep === 0
                ? "Iniciar"
                : currentGuideStep === guideSteps.length - 1
                    ? "Volver al inicio"
                    : "Siguiente";

            if (step.page) {
                guideWelcome.hidden = true;
                guideFrame.hidden = false;
                if (guideFrame.getAttribute("src") !== step.page) {
                    guideFrame.setAttribute("src", step.page);
                }
                previewTitle.textContent = step.title;
                openModuleLink.hidden = false;
                openModuleLink.href = step.page;
            } else {
                guideFrame.hidden = true;
                guideWelcome.hidden = false;
                previewTitle.textContent = step.title;
                openModuleLink.hidden = currentGuideStep === 0;
                openModuleLink.href = "index.html";
                if (currentGuideStep === guideSteps.length - 1) {
                    guideWelcome.innerHTML = `
                        <div class="guide-welcome-inner">
                            <div class="guide-welcome-icon" aria-hidden="true">✓</div>
                            <h2>Demostración completada</h2>
                            <p>Ya se han presentado los módulos y las funciones principales del Landing Siscard+.</p>
                            <div class="guide-finish-actions">
                                <a class="guide-button primary" href="index.html">Ir al Inicio</a>
                                <button class="guide-button" id="repeatGuideButton" type="button">Repetir guía</button>
                            </div>
                        </div>
                    `;
                    document.getElementById("repeatGuideButton").addEventListener("click", function () {
                        currentGuideStep = 0;
                        resetWelcome();
                        renderGuideStep();
                    });
                    localStorage.setItem("siscardQuickGuideCompleted", "true");
                }
            }
            localStorage.setItem("siscardGuideStep", String(currentGuideStep));
        }

        function resetWelcome() {
            guideWelcome.innerHTML = `
                <div class="guide-welcome-inner">
                    <div class="guide-welcome-icon" aria-hidden="true">▶</div>
                    <h2>Recorrido interactivo</h2>
                    <p>La demostración abrirá cada módulo dentro de esta página y explicará las funciones disponibles. No se enviarán solicitudes ni se modificarán datos durante el recorrido.</p>
                </div>
            `;
        }

        previousGuideButton.addEventListener("click", function () {
            if (currentGuideStep > 0) {
                currentGuideStep -= 1;
                if (currentGuideStep === 0) {
                    resetWelcome();
                }
                renderGuideStep();
            }
        });

        nextGuideButton.addEventListener("click", function () {
            if (currentGuideStep === guideSteps.length - 1) {
                window.location.href = "index.html";
                return;
            }
            currentGuideStep += 1;
            renderGuideStep();
        });

        document.getElementById("exitGuideButton").addEventListener("click", function () {
            window.location.href = "index.html";
        });

        const requestedStep = new URLSearchParams(window.location.search).get("paso");
        if (requestedStep !== null && Number.isInteger(Number(requestedStep))) {
            currentGuideStep = Math.min(
                Math.max(Number(requestedStep), 0),
                guideSteps.length - 1
            );
        }

        renderGuideStep();
    </script>
</body>
</html>
