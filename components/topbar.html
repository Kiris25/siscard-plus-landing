<header class="topbar">
    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Abrir menú"
        aria-controls="sidebar"
        aria-expanded="false"
    >
        ☰
    </button>

    <div class="top-title">
        <strong id="sharedPageTitle">
            Centro de Servicios Siscard+
        </strong>

        <small id="sharedPageSubtitle">
            Acceso y autogestión
        </small>
    </div>

    <div class="top-actions">
        <button
            class="icon-button"
            type="button"
            data-coming-soon="Notificaciones"
            aria-label="Notificaciones"
        >
            🔔
            <span class="notification-dot">
                3
            </span>
        </button>

        <button
            class="help-button"
            type="button"
            data-coming-soon="Centro de ayuda"
        >
            Ayuda
        </button>

        <button
            class="profile-button"
            id="profileButton"
            type="button"
            aria-expanded="false"
        >
            <span class="avatar">
                CL
            </span>

            <span class="profile-copy">
                <strong>
                    Cliente Siscard+
                </strong>

                <small>
                    Portal de servicios
                </small>
            </span>

            <span>
                ⌄
            </span>
        </button>
    </div>

    <div
        class="profile-menu"
        id="profileMenu"
        hidden
    >
        <button
            type="button"
            data-coming-soon="Mi perfil"
        >
            Mi perfil
        </button>

        <button
            type="button"
            data-coming-soon="Preferencias"
        >
            Preferencias
        </button>

        <button
            type="button"
            data-coming-soon="Cerrar sesión"
        >
            Cerrar sesión
        </button>
    </div>
</header>
