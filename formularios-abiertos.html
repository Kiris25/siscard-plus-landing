<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios abiertos | Landing Siscard+</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .draft-hero,
        .draft-panel {
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: var(--radius-large);
            background: #ffffff;
            box-shadow: var(--shadow-small);
        }

        .draft-hero h1 {
            margin: 7px 0;
            color: var(--orange);
            font-weight: 300;
        }

        .draft-panel {
            margin-top: 18px;
        }

        .draft-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .draft-toolbar input {
            width: min(380px, 100%);
            min-height: 42px;
            padding: 9px 12px;
            border-radius: var(--radius);
        }

        .draft-table-wrap {
            overflow: auto;
        }

        .draft-table {
            width: 100%;
            border-collapse: collapse;
        }

        .draft-table th,
        .draft-table td {
            padding: 11px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
            font-size: 12px;
        }

        .draft-table th {
            color: var(--sidebar);
            background: var(--surface-soft);
            font-size: 10px;
            text-transform: uppercase;
        }

        .draft-id {
            color: var(--orange-dark);
            font-weight: 850;
        }

        .draft-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .empty {
            padding: 34px;
            color: var(--muted);
            text-align: center;
        }

        .dialog-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(25, 25, 25, 0.72);
        }

        .dialog-overlay[hidden] {
            display: none;
        }

        .dialog {
            width: min(480px, 100%);
            padding: 22px;
            border-top: 5px solid var(--orange);
            border-radius: var(--radius-large);
            background: #ffffff;
        }

        .dialog input {
            width: 100%;
            min-height: 44px;
            margin: 10px 0;
            padding: 9px 12px;
            border-radius: var(--radius);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media (max-width: 760px) {
            .draft-table thead {
                display: none;
            }

            .draft-table,
            .draft-table tbody,
            .draft-table tr,
            .draft-table td {
                display: block;
            }

            .draft-table tr {
                margin-bottom: 10px;
                padding: 10px;
                border: 1px solid var(--line);
            }

            .draft-table td {
                padding: 5px;
                border: 0;
            }
        }
    </style>
</head>
<body
    data-page-title="Formularios abiertos"
    data-page-subtitle="Borradores guardados"
>
    <div class="app-shell">
        <div id="sidebar-container"></div>

        <div class="main-area">
            <div id="topbar-container"></div>

            <main class="content">
                <div style="margin-bottom: 14px;">
                    <a class="tertiary-button" href="formularios.html">
                        ← Volver a Formularios Siscard+
                    </a>
                </div>

                <section class="draft-hero">
                    <span class="section-kicker">Centro de Solicitudes</span>
                    <h1>Formularios abiertos</h1>
                    <p>
                        Consulte y continúe los formularios guardados como borrador.
                    </p>
                </section>

                <section class="draft-panel">
                    <div class="draft-toolbar">
                        <div>
                            <strong id="count">Cargando borradores...</strong>
                            <small
                                style="display: block; color: var(--muted); margin-top: 4px;"
                            >
                                Los borradores se almacenan en data/borradores.json.
                            </small>
                        </div>

                        <input
                            id="search"
                            type="search"
                            placeholder="Buscar por ID, cliente, emisor u opción"
                        >
                    </div>

                    <div class="draft-table-wrap" id="content"></div>
                </section>
            </main>

            <div id="footer-container"></div>
        </div>
    </div>

    <div class="dialog-overlay" id="credentialOverlay" hidden>
        <section class="dialog">
            <h2>Credencial requerida</h2>
            <p>Ingrese la credencial para actualizar borradores.</p>

            <input
                id="credential"
                type="password"
                autocomplete="off"
                placeholder="Credencial de acceso"
            >

            <small
                id="credentialMessage"
                style="color: var(--red); display: block; min-height: 18px;"
            ></small>

            <div class="dialog-actions">
                <button
                    class="tertiary-button"
                    id="cancelCredential"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    class="primary-button"
                    id="continueCredential"
                    type="button"
                >
                    Continuar
                </button>
            </div>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script>
        "use strict";

        const SETTINGS = {
            owner: "Kiris25",
            repository: "siscard-plus-landing",
            branch: "main",
            path: "data/borradores.json"
        };

        let drafts = [];
        let pendingAction = null;

        function escapeHtml(value) {
            const container = document.createElement("div");
            container.textContent = String(value ?? "");
            return container.innerHTML;
        }

        function normalize(value) {
            return String(value ?? "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");

            window.setTimeout(
                () => toast.classList.remove("show"),
                2600
            );
        }

        function githubApiUrl() {
            return `https://api.github.com/repos/${SETTINGS.owner}/${SETTINGS.repository}/contents/${SETTINGS.path}`;
        }

        function githubHeaders(credential) {
            return {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${credential}`,
                "X-GitHub-Api-Version": "2022-11-28"
            };
        }

        function utf8ToBase64(value) {
            const bytes = new TextEncoder().encode(value);
            let binary = "";

            bytes.forEach((byte) => {
                binary += String.fromCharCode(byte);
            });

            return btoa(binary);
        }

        async function loadDrafts() {
            try {
                const response = await fetch(
                    `data/borradores.json?v=${Date.now()}`,
                    { cache: "no-store" }
                );

                drafts = response.ok
                    ? await response.json()
                    : [];

                if (!Array.isArray(drafts)) {
                    drafts = [];
                }

                renderDrafts();
            } catch (error) {
                console.error(error);
                drafts = [];
                renderDrafts();
                showToast("No fue posible cargar los borradores.");
            }
        }

        function formatDate(value) {
            if (!value) {
                return "";
            }

            const date = new Date(value);

            return Number.isNaN(date.getTime())
                ? value
                : date.toLocaleString("es-CR");
        }

        function renderDrafts() {
            const query = normalize(
                document.getElementById("search").value
            );

            const filteredDrafts = drafts
                .filter((draft) => {
                    const searchableText = normalize([
                        draft.id,
                        draft.cliente,
                        draft.emisor,
                        draft.opcion,
                        draft.tipo
                    ].join(" "));

                    return searchableText.includes(query);
                })
                .sort((first, second) =>
                    String(second.fechaActualizacion || "")
                        .localeCompare(
                            String(first.fechaActualizacion || "")
                        )
                );

            document.getElementById("count").textContent =
                `${filteredDrafts.length} borrador${
                    filteredDrafts.length === 1 ? "" : "es"
                }`;

            const content = document.getElementById("content");

            if (!filteredDrafts.length) {
                content.innerHTML = `
                    <div class="empty">
                        No hay formularios abiertos.
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <table class="draft-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo / Opción</th>
                            <th>Cliente / Emisor</th>
                            <th>Actualizado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredDrafts.map((draft) => `
                            <tr>
                                <td class="draft-id">
                                    ${escapeHtml(draft.id)}
                                </td>
                                <td>
                                    Solicitud de parámetros
                                    <br>
                                    <small>
                                        OP${escapeHtml(draft.opcion || "")}
                                    </small>
                                </td>
                                <td>
                                    ${escapeHtml(draft.cliente || "Sin cliente")}
                                    <br>
                                    <small>
                                        ${escapeHtml(draft.emisor || "Sin emisor")}
                                    </small>
                                </td>
                                <td>
                                    ${escapeHtml(
                                        formatDate(draft.fechaActualizacion)
                                    )}
                                </td>
                                <td>
                                    <div class="draft-actions">
                                        <a
                                            class="primary-button"
                                            href="formulario-parametros.html?opcion=${
                                                encodeURIComponent(
                                                    draft.opcion || "05"
                                                )
                                            }&borrador=${
                                                encodeURIComponent(draft.id)
                                            }"
                                        >
                                            Continuar
                                        </a>

                                        <button
                                            class="tertiary-button"
                                            data-duplicate="${escapeHtml(draft.id)}"
                                            type="button"
                                        >
                                            Duplicar
                                        </button>

                                        <button
                                            class="tertiary-button"
                                            data-delete="${escapeHtml(draft.id)}"
                                            type="button"
                                        >
                                            Eliminar
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function requestCredential(action) {
            pendingAction = action;

            const savedCredential =
                localStorage.getItem("siscardAccessCredential") || "";

            document.getElementById("credential").value =
                savedCredential;

            document.getElementById("credentialMessage").textContent = "";
            document.getElementById("credentialOverlay").hidden = false;

            window.setTimeout(
                () => document.getElementById("credential").focus(),
                20
            );
        }

        async function writeDrafts(
            credential,
            updatedDrafts,
            commitMessage
        ) {
            const currentResponse = await fetch(
                `${githubApiUrl()}?ref=${SETTINGS.branch}&v=${Date.now()}`,
                {
                    headers: githubHeaders(credential),
                    cache: "no-store"
                }
            );

            if (!currentResponse.ok) {
                throw new Error(
                    "No fue posible leer el archivo remoto."
                );
            }

            const currentFile = await currentResponse.json();

            const updateResponse = await fetch(
                githubApiUrl(),
                {
                    method: "PUT",
                    headers: {
                        ...githubHeaders(credential),
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: utf8ToBase64(
                            `${JSON.stringify(updatedDrafts, null, 2)}\n`
                        ),
                        branch: SETTINGS.branch,
                        sha: currentFile.sha
                    })
                }
            );

            if (!updateResponse.ok) {
                throw new Error(
                    "No fue posible guardar el cambio."
                );
            }

            localStorage.setItem(
                "siscardAccessCredential",
                credential
            );

            drafts = updatedDrafts;
            renderDrafts();
        }

        document.getElementById("content").addEventListener(
            "click",
            (event) => {
                const deleteButton =
                    event.target.closest("[data-delete]");

                const duplicateButton =
                    event.target.closest("[data-duplicate]");

                if (deleteButton) {
                    requestCredential({
                        type: "delete",
                        id: deleteButton.dataset.delete
                    });
                }

                if (duplicateButton) {
                    requestCredential({
                        type: "duplicate",
                        id: duplicateButton.dataset.duplicate
                    });
                }
            }
        );

        document.getElementById("continueCredential").addEventListener(
            "click",
            async () => {
                const credential =
                    document.getElementById("credential").value.trim();

                if (!credential || !pendingAction) {
                    return;
                }

                try {
                    let updatedDrafts = [...drafts];

                    if (pendingAction.type === "delete") {
                        updatedDrafts = updatedDrafts.filter(
                            (draft) => draft.id !== pendingAction.id
                        );
                    } else {
                        const originalDraft = drafts.find(
                            (draft) => draft.id === pendingAction.id
                        );

                        if (originalDraft) {
                            const copiedDraft =
                                structuredClone(originalDraft);

                            copiedDraft.id =
                                `${originalDraft.id}-COPIA-${
                                    Date.now().toString().slice(-5)
                                }`;

                            copiedDraft.fechaCreacion =
                                new Date().toISOString();

                            copiedDraft.fechaActualizacion =
                                copiedDraft.fechaCreacion;

                            updatedDrafts.unshift(copiedDraft);
                        }
                    }

                    const commitMessage =
                        pendingAction.type === "delete"
                            ? `Eliminar borrador ${pendingAction.id}`
                            : `Duplicar borrador ${pendingAction.id}`;

                    await writeDrafts(
                        credential,
                        updatedDrafts,
                        commitMessage
                    );

                    document.getElementById(
                        "credentialOverlay"
                    ).hidden = true;

                    showToast("Borradores actualizados.");
                } catch (error) {
                    console.error(error);

                    document.getElementById(
                        "credentialMessage"
                    ).textContent = error.message;
                }
            }
        );

        document.getElementById("cancelCredential").addEventListener(
            "click",
            () => {
                document.getElementById(
                    "credentialOverlay"
                ).hidden = true;
            }
        );

        document.getElementById("search").addEventListener(
            "input",
            renderDrafts
        );

        loadDrafts();
    </script>
</body>
</html>
